<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" font-family="Helvetica, Arial, sans-serif">
  <rect width="520" height="220" fill="#f8f8f8"/>

  <!-- ── Door group ─────────────────────────────────── -->
  <text x="110" y="22" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">Door primitives</text>

  <!-- Wall stubs -->
  <rect x="20"  y="128" width="46" height="16" rx="1" fill="#d0d0d0"/>
  <rect x="154" y="128" width="46" height="16" rx="1" fill="#d0d0d0"/>

  <!-- door_origin (purple) -->
  <line x1="66" y1="136" x2="154" y2="136" stroke="#8B5CF6" stroke-width="3.5" stroke-linecap="round"/>

  <!-- door_leaf (orange) -->
  <line x1="66" y1="136" x2="66" y2="48"  stroke="#F97316" stroke-width="3" stroke-linecap="round"/>

  <!-- door_arc (red) -->
  <path d="M 66 48 A 88 88 0 0 1 154 136" stroke="#EF4444" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- hinge dot -->
  <circle cx="66" cy="136" r="4" fill="#8B5CF6"/>

  <!-- Labels -->
  <text x="110" y="158" text-anchor="middle" font-size="11" fill="#7C3AED" font-weight="bold">door_origin (purple)</text>
  <text x="74"  y="92"  font-size="11" fill="#EA580C" font-weight="bold">door_leaf</text>
  <text x="74"  y="105" font-size="10" fill="#9CA3AF">(orange)</text>
  <text x="128" y="76"  text-anchor="middle" font-size="11" fill="#DC2626" font-weight="bold">door_arc (red)</text>

  <!-- ── Divider ───────────────────────────────────── -->
  <line x1="225" y1="14" x2="225" y2="206" stroke="#e0e0e0" stroke-width="1"/>

  <!-- ── Window group ───────────────────────────────── -->
  <text x="370" y="22" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">Window primitive</text>

  <!-- Wall stubs -->
  <rect x="250" y="128" width="46" height="16" rx="1" fill="#d0d0d0"/>
  <rect x="454" y="128" width="46" height="16" rx="1" fill="#d0d0d0"/>

  <!-- window (blue double line) -->
  <line x1="296" y1="136" x2="454" y2="136" stroke="#3B82F6" stroke-width="9" stroke-linecap="butt"/>
  <line x1="296" y1="136" x2="454" y2="136" stroke="white"   stroke-width="3" stroke-linecap="butt"/>

  <!-- Label -->
  <text x="375" y="158" text-anchor="middle" font-size="11" fill="#2563EB" font-weight="bold">window (blue)</text>
</svg>
